<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;600;700;800&display=swap');
    body { margin: 0; font-family: 'Gothic A1', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #8a6a00; } a:hover { color: #5e4800; }
    button { font-family: inherit; cursor: pointer; }
    .num { font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<!-- A안 · 창구 요약서 — 마감본
     · 코드 카드: 검정 면 위에 숫자 여섯 자리를 칸으로 나눠 놓는다. 직원이 한 번에 읽는다.
     · 아래 정보는 두 칸 그리드. 번호표는 노란 칩으로.
     · 붉은 왼쪽 선 대신 작은 알약. 홈 화면 내역과 같은 언어.
     · 준비물은 동그란 체크. 채운 것과 빈 것으로 필수 여부가 보인다. -->
<div style="width: 393px; min-height: 960px; background: #f3f2ee; display: flex; flex-direction: column;">

  <div style="background: #fff; padding: 14px 18px; display: flex; align-items: center; gap: 14px;">
    <button style="flex: none; width: 48px; height: 48px; border-radius: 14px; border: 1px solid #e6e3dc; background: #fff; display: flex; align-items: center; justify-content: center;">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#3d3a34" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg>
    </button>
    <h1 style="flex: 1; margin: 0; font-size: 23px; font-weight: 800; color: #17161a; letter-spacing: -0.5px;">창구 요약서</h1>
    <span style="flex: none; font-size: 13px; font-weight: 700; color: #85817a; background: #f3f2ee; padding: 7px 12px; border-radius: 999px;">직원용</span>
  </div>

  <!-- 코드 -->
  <div style="background: #fff; padding: 6px 18px 22px;">
    <div style="background: #17161a; border-radius: 24px; padding: 24px 22px 22px; box-shadow: 0 14px 34px rgba(23, 22, 26, 0.22);">
      <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 16px;">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#ffbc00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9h4"/><path d="M7 13h10"/></svg>
        <p style="margin: 0; font-size: 15px; font-weight: 700; color: #cfcbc1;">직원에게 이 번호를 보여주세요</p>
      </div>
      <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 7px;">
        <span class="num" style="height: 62px; border-radius: 14px; background: #2a2925; color: #fff; font-size: 34px; font-weight: 800; display: flex; align-items: center; justify-content: center;">4</span>
        <span class="num" style="height: 62px; border-radius: 14px; background: #2a2925; color: #fff; font-size: 34px; font-weight: 800; display: flex; align-items: center; justify-content: center;">8</span>
        <span class="num" style="height: 62px; border-radius: 14px; background: #2a2925; color: #fff; font-size: 34px; font-weight: 800; display: flex; align-items: center; justify-content: center;">2</span>
        <span class="num" style="height: 62px; border-radius: 14px; background: #2a2925; color: #fff; font-size: 34px; font-weight: 800; display: flex; align-items: center; justify-content: center;">9</span>
        <span class="num" style="height: 62px; border-radius: 14px; background: #2a2925; color: #fff; font-size: 34px; font-weight: 800; display: flex; align-items: center; justify-content: center;">1</span>
        <span class="num" style="height: 62px; border-radius: 14px; background: #2a2925; color: #fff; font-size: 34px; font-weight: 800; display: flex; align-items: center; justify-content: center;">3</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 20px; padding-top: 18px; border-top: 1px solid #333029;">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <p style="margin: 0; font-size: 13px; font-weight: 600; color: #8f8a7f;">번호표</p>
          <span class="num" style="align-self: flex-start; background: #ffbc00; color: #17161a; font-size: 18px; font-weight: 800; padding: 5px 12px; border-radius: 999px;">12번</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <p style="margin: 0; font-size: 13px; font-weight: 600; color: #8f8a7f;">지점</p>
          <p style="margin: 0; font-size: 18px; font-weight: 800; color: #fff; line-height: 1.5;">KB국민은행 종로지점</p>
        </div>
      </div>
    </div>
  </div>

  <!-- 하려던 일 -->
  <div style="padding: 26px 18px 0;">
    <p style="margin: 0 0 12px; font-size: 14px; font-weight: 700; color: #9a968c; letter-spacing: 0.4px;">창구에서 하려던 일</p>
    <div style="background: #fff; border: 1px solid #e9e6df; border-radius: 20px; padding: 20px 22px 22px; box-shadow: 0 1px 2px rgba(23, 22, 26, 0.04), 0 8px 24px rgba(23, 22, 26, 0.05);">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px;">
        <span style="display: inline-flex; align-items: center; gap: 6px; background: #ffbc00; color: #17161a; font-size: 14px; font-weight: 800; padding: 6px 12px 6px 10px; border-radius: 999px;">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#17161a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
          보내기
        </span>
        <span style="font-size: 13px; font-weight: 600; color: #b3afa6;">직원 확인 후 진행</span>
      </div>
      <p style="margin: 0 0 4px; font-size: 22px; font-weight: 800; color: #17161a; letter-spacing: -0.5px;">아들 김철수 님에게</p>
      <div style="display: flex; align-items: baseline; gap: 4px; margin: 0 0 12px;">
        <span class="num" style="font-size: 36px; font-weight: 800; color: #17161a; letter-spacing: -1.4px; line-height: 1.1;">200,000</span>
        <span style="font-size: 22px; font-weight: 700; color: #17161a;">원</span>
      </div>
      <p class="num" style="margin: 0; font-size: 15px; font-weight: 600; color: #85817a;">KB국민은행 · 9876-54-****98</p>
    </div>
  </div>

  <!-- 여쭤볼 것 -->
  <div style="padding: 22px 18px 0;">
    <p style="margin: 0 0 12px; font-size: 14px; font-weight: 700; color: #9a968c; letter-spacing: 0.4px;">창구에서 여쭤볼 것</p>
    <div style="background: #fff; border: 1px solid #e9e6df; border-radius: 20px; padding: 20px 22px 22px; box-shadow: 0 1px 2px rgba(23, 22, 26, 0.04), 0 8px 24px rgba(23, 22, 26, 0.05);">
      <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px;">
        <span style="color: #c5221f; background: #fdecec; font-size: 14px; font-weight: 700; padding: 5px 11px; border-radius: 999px;">확인 안 됨</span>
        <span style="font-size: 14px; font-weight: 600; color: #85817a;">오늘 출금</span>
      </div>
      <p style="margin: 0 0 6px; font-size: 22px; line-height: 1.5; font-weight: 800; color: #17161a; letter-spacing: -0.4px;">‘대한정보통신’ <span class="num">19,000원</span></p>
      <p style="margin: 0; font-size: 18px; line-height: 1.5; font-weight: 500; color: #4a463f;">이 돈이 무엇인지 여쭤보기</p>
    </div>
  </div>

  <!-- 준비물 -->
  <div style="padding: 22px 18px 22px;">
    <p style="margin: 0 0 12px; font-size: 14px; font-weight: 700; color: #9a968c; letter-spacing: 0.4px;">가져가실 것</p>
    <div style="background: #fff; border: 1px solid #e9e6df; border-radius: 20px; padding: 4px 22px; box-shadow: 0 1px 2px rgba(23, 22, 26, 0.04), 0 8px 24px rgba(23, 22, 26, 0.05);">
      <div style="display: flex; align-items: center; gap: 14px; padding: 16px 0; border-bottom: 1px solid #f0eeea;">
        <span style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #1d7a3d; display: flex; align-items: center; justify-content: center;">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        </span>
        <b style="flex: 1; font-size: 21px; font-weight: 800; color: #17161a; letter-spacing: -0.4px;">신분증</b>
        <span style="font-size: 14px; font-weight: 800; color: #c5221f;">꼭 필요해요</span>
      </div>
      <div style="display: flex; align-items: center; gap: 14px; padding: 16px 0;">
        <span style="flex: none; width: 28px; height: 28px; border-radius: 50%; border: 2px solid #d9d5cc; box-sizing: border-box;"></span>
        <b style="flex: 1; font-size: 21px; font-weight: 700; color: #6b675e; letter-spacing: -0.4px;">통장 또는 카드</b>
        <span style="font-size: 14px; font-weight: 600; color: #b3afa6;">있으면 좋아요</span>
      </div>
    </div>
  </div>

  <div style="padding: 0 18px 26px; display: flex; align-items: center; justify-content: center; gap: 7px;">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#9a968c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    <p style="margin: 0; text-align: center; font-size: 15px; font-weight: 600; color: #9a968c;">이체는 앱이 아니라 창구에서 직원이 도와드려요</p>
  </div>
</div>
</x-dc>
</body>
</html>
