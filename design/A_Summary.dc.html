<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;600;700;800;900&display=swap');
    body { margin: 0; font-family: 'Gothic A1', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
    a { color: #8a6a00; } a:hover { color: #5e4800; }
  </style>
</helmet>

<!-- A안 다듬음 · 창구 요약서
     바뀐 것: 코드 카드에 티켓 절취선을 넣어 "창구에 내미는 것"이라는 은유를 살리고,
     세 구획을 번호로 묶어 직원이 순서대로 읽게, 여쭤볼 것은 붉은 면으로 눈에 먼저 들어오게. -->
<div style="width: 460px; min-height: 900px; background: #f7f5f0; display: flex; flex-direction: column;">

  <div style="background: #fff; border-bottom: 3px solid #ffbc00; padding: 12px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 8px rgba(120,90,20,0.06);">
    <button style="flex: none; width: 52px; height: 52px; border-radius: 15px; border: 2px solid #e2ddd0; background: #fff; display: flex; align-items: center; justify-content: center;">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#3d3629" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg>
    </button>
    <h1 style="flex: 1; margin: 0; font-size: 24px; font-weight: 900; color: #1b1b1b; letter-spacing: -0.4px;">창구 요약서</h1>
  </div>

  <!-- 티켓: 코드 -->
  <div style="margin: 16px 16px 0; background: #1f1b12; border-radius: 22px 22px 4px 4px; padding: 22px 20px 20px; text-align: center; position: relative; overflow: hidden;">
    <svg viewBox="0 0 24 24" width="180" height="180" style="position: absolute; left: -46px; bottom: -58px; opacity: 0.07;" fill="#ffbc00"><path d="m12 2 2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.3 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8L12 2z"/></svg>
    <p style="position: relative; margin: 0 0 8px; font-size: 16px; font-weight: 800; color: #ffcf4d; letter-spacing: 0.3px;">직원에게 이 번호를 보여주세요</p>
    <div style="position: relative; font-size: 50px; font-weight: 900; color: #fff; letter-spacing: 11px; line-height: 1.1; text-indent: 11px;">482913</div>
  </div>

  <!-- 절취선 -->
  <div style="margin: 0 16px; height: 22px; background: #1f1b12; position: relative; display: flex; align-items: center;">
    <span style="position: absolute; left: -11px; width: 22px; height: 22px; border-radius: 50%; background: #f7f5f0;"></span>
    <span style="position: absolute; right: -11px; width: 22px; height: 22px; border-radius: 50%; background: #f7f5f0;"></span>
    <span style="flex: 1; margin: 0 18px; border-top: 2px dashed rgba(255,255,255,0.32);"></span>
  </div>

  <!-- 티켓: 번호표 -->
  <div style="margin: 0 16px 18px; background: #1f1b12; border-radius: 4px 4px 22px 22px; padding: 16px 20px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px;">
    <div style="text-align: left;">
      <p style="margin: 0 0 2px; font-size: 14px; font-weight: 700; color: #a89b7d;">번호표</p>
      <p style="margin: 0; font-size: 27px; font-weight: 900; color: #ffcf4d; line-height: 1;">12번</p>
    </div>
    <div style="text-align: right;">
      <p style="margin: 0 0 2px; font-size: 14px; font-weight: 700; color: #a89b7d;">지점</p>
      <p style="margin: 0; font-size: 18px; font-weight: 800; color: #f0ece0; line-height: 1.25;">KB국민은행<br>종로지점</p>
    </div>
  </div>

  <!-- 1. 하려던 일 -->
  <div style="margin: 0 16px 11px; background: #fff; border-radius: 20px; padding: 18px; box-shadow: 0 3px 12px rgba(120,90,20,0.08);">
    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 13px;">
      <span style="flex: none; width: 30px; height: 30px; border-radius: 50%; background: #ffbc00; color: #3d2e00; font-size: 16px; font-weight: 900; display: flex; align-items: center; justify-content: center;">1</span>
      <h3 style="margin: 0; font-size: 20px; font-weight: 900; color: #1b1b1b; letter-spacing: -0.3px;">창구에서 하려던 일</h3>
    </div>
    <div style="background: #fffaeb; border-radius: 14px; padding: 15px 16px;">
      <p style="margin: 0 0 9px; display: inline-block; background: #ffbc00; color: #3d2e00; font-size: 14px; font-weight: 900; padding: 3px 10px; border-radius: 999px;">보내기(이체)</p>
      <p style="margin: 0; font-size: 21px; line-height: 1.65; color: #1b1b1b;">받는 사람 <b>아들 김철수</b><br>
      <span style="font-size: 16px; color: #7d7566;">KB국민은행 9876-54-****98</span></p>
      <p style="margin: 10px 0 0; font-size: 26px; font-weight: 900; color: #1b1b1b; letter-spacing: -0.6px;">200,000원</p>
    </div>
  </div>

  <!-- 2. 여쭤볼 것 -->
  <div style="margin: 0 16px 11px; background: #fff; border-radius: 20px; padding: 18px; box-shadow: 0 3px 12px rgba(120,90,20,0.08);">
    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 13px;">
      <span style="flex: none; width: 30px; height: 30px; border-radius: 50%; background: #c5221f; color: #fff; font-size: 16px; font-weight: 900; display: flex; align-items: center; justify-content: center;">2</span>
      <h3 style="margin: 0; font-size: 20px; font-weight: 900; color: #1b1b1b; letter-spacing: -0.3px;">창구에서 여쭤볼 것</h3>
    </div>
    <div style="background: #fdeceb; border-radius: 14px; padding: 15px 16px;">
      <p style="margin: 0; font-size: 20px; line-height: 1.6; color: #1b1b1b;">'대한정보통신' <b>19,000원</b><br>오늘 출금이 무엇인지</p>
      <p style="margin: 9px 0 0; font-size: 15px; font-weight: 700; color: #a81b18;">앱에서 확인되지 않은 거래예요</p>
    </div>
  </div>

  <!-- 3. 준비물 -->
  <div style="margin: 0 16px 22px; background: #fff; border-radius: 20px; padding: 18px; box-shadow: 0 3px 12px rgba(120,90,20,0.08);">
    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 13px;">
      <span style="flex: none; width: 30px; height: 30px; border-radius: 50%; background: #3d3629; color: #fff; font-size: 16px; font-weight: 900; display: flex; align-items: center; justify-content: center;">3</span>
      <h3 style="margin: 0; font-size: 20px; font-weight: 900; color: #1b1b1b; letter-spacing: -0.3px;">가져가실 것</h3>
    </div>
    <div style="display: flex; flex-direction: column; gap: 9px;">
      <div style="display: flex; align-items: center; gap: 11px; background: #f7f5f0; border-radius: 14px; padding: 13px 15px;">
        <svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="#1e8e3e" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        <b style="flex: 1; font-size: 21px; font-weight: 900; color: #1b1b1b;">신분증</b>
        <span style="background: #c5221f; color: #fff; font-size: 13px; font-weight: 900; padding: 3px 10px; border-radius: 999px;">꼭</span>
      </div>
      <div style="display: flex; align-items: center; gap: 11px; background: #f7f5f0; border-radius: 14px; padding: 13px 15px;">
        <svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="#b8ae9c" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        <b style="flex: 1; font-size: 20px; font-weight: 700; color: #5f5849;">통장 또는 카드</b>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
