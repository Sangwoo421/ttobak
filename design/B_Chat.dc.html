<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Gothic+A1:wght@400;500;700;800&display=swap');
    body { margin: 0; font-family: 'Gothic A1', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
    a { color: #8a5a2b; } a:hover { color: #6b4520; }
  </style>
</helmet>

<!-- B안 대화: 말풍선 없이 편지처럼. 읽는 부담을 줄이고 마이크는 원형으로 크게. -->
<div style="width: 460px; min-height: 900px; background: #faf6ee; display: flex; flex-direction: column;">

  <div style="padding: 16px 20px 12px; display: flex; align-items: center; gap: 12px; border-bottom: 2px solid #e6dcc8;">
    <button style="flex: none; width: 50px; height: 50px; border-radius: 50%; border: 2px solid #ddcda9; background: #fff; display: flex; align-items: center; justify-content: center;">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#8a5a2b" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg>
    </button>
    <h1 style="flex: 1; margin: 0; font-family: 'Nanum Myeongjo', serif; font-size: 25px; font-weight: 800; color: #3d3226;">물어보기</h1>
  </div>

  <!-- 대화: 말풍선 대신 문단 -->
  <div style="flex: 1; padding: 22px 22px 10px; display: flex; flex-direction: column; gap: 22px;">

    <div>
      <p style="margin: 0 0 6px; font-size: 15px; font-weight: 800; color: #a08b6a; letter-spacing: 0.6px;">또박또박</p>
      <p style="margin: 0; font-size: 23px; line-height: 1.6; color: #3d3226;">어제 오후에 아드님 김철수 님이 300,000원 보내셨어요. 등록된 아들 통장이에요.</p>
    </div>

    <div style="align-self: flex-end; max-width: 82%; background: #f0e4cc; border-radius: 20px; padding: 14px 18px;">
      <p style="margin: 0; font-size: 21px; line-height: 1.5; color: #5c4a2e;">세 번째 그 정보통신인가 그건 뭐야</p>
    </div>

    <div>
      <p style="margin: 0 0 6px; font-size: 15px; font-weight: 800; color: #a08b6a; letter-spacing: 0.6px;">또박또박</p>
      <p style="margin: 0; font-size: 23px; line-height: 1.6; color: #3d3226;">통장에는 '대한정보통신'이라고만 적혀 있어서, 무슨 돈인지는 제가 알 수 없어요.</p>
      <p style="margin: 10px 0 0; font-size: 23px; line-height: 1.6; font-weight: 800; color: #3d3226;">창구에서 여쭤볼 목록에 적어둘까요?</p>
    </div>

  </div>

  <!-- 하단 -->
  <div style="padding: 6px 22px 24px; display: flex; flex-direction: column; gap: 14px;">

    <div style="display: flex; gap: 12px;">
      <button style="flex: 1; min-height: 76px; border-radius: 20px; border: none; background: #3d3226; color: #faf6ee; font-size: 22px; font-weight: 800; box-shadow: 0 3px 0 #241d15;">네, 적어주세요</button>
      <button style="flex: 1; min-height: 76px; border-radius: 20px; border: 2px solid #ddcda9; background: #fff; color: #3d3226; font-size: 22px; font-weight: 800;">아니요</button>
    </div>

    <div style="display: flex; align-items: center; gap: 16px; padding-top: 6px;">
      <button style="flex: none; width: 92px; height: 92px; border-radius: 50%; border: none; background: #f0e4cc; box-shadow: 0 4px 0 #ddcda9; display: flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="#8a5a2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v3"/></svg>
      </button>
      <div style="flex: 1;">
        <p style="margin: 0 0 3px; font-size: 21px; font-weight: 800; color: #3d3226;">눌러서 말하기</p>
        <p style="margin: 0; font-size: 16px; line-height: 1.5; color: #8a7c66;">천천히 말씀하세요. 마치면 알아서 알아들어요.</p>
      </div>
    </div>

    <div style="display: flex; gap: 8px;">
      <input placeholder="글로 물어보세요" style="flex: 1; min-height: 54px; border: 2px solid #e6dcc8; border-radius: 14px; padding: 0 14px; font-size: 18px; color: #3d3226; background: #fff;">
      <button style="flex: none; min-height: 54px; padding: 0 18px; border-radius: 14px; border: 2px solid #ddcda9; background: #f0e4cc; color: #5c4a2e; font-size: 18px; font-weight: 800;">보내기</button>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
