<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;600;700;800&display=swap');
    body { margin: 0; font-family: 'Gothic A1', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #8a6a00; } a:hover { color: #5e4800; }
    button { font-family: inherit; cursor: pointer; }
    .num { font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<!-- A안 · 홈 — 마감본
     구조는 정돈본과 같다. 마감만 올린다.
     · 카드: 흰 면 + 1px 따뜻한 회색 테두리 + 아주 옅은 그림자 두 겹. 종이가 놓인 정도의 깊이.
     · 상태는 글자 대신 작은 알약(pill). 색 면적을 작게 유지.
     · 숫자는 tabular-nums 로 자리 맞춤. 금액 옆 단위는 한 단계 작게.
     · 잔액 카드 안에 읽어주기 버튼. 이 앱의 핵심 동작을 첫 화면에서 바로. -->
<div style="width: 393px; min-height: 852px; background: #f3f2ee; display: flex; flex-direction: column;">

  <!-- 헤더 -->
  <div style="background: #fff; padding: 16px 18px 12px; display: flex; align-items: center; gap: 14px;">
    <span style="flex: none; width: 46px; height: 46px; border-radius: 50%; background: #ffbc00; color: #17161a; font-size: 20px; font-weight: 800; display: flex; align-items: center; justify-content: center;">영</span>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0;">
      <p style="margin: 0; font-size: 23px; font-weight: 800; color: #17161a; letter-spacing: -0.6px; line-height: 1.1;">김영자 님</p>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #85817a;">
        <span style="width: 7px; height: 7px; border-radius: 50%; background: #1d7a3d;"></span>
        어르신 모드 켜짐
      </span>
    </div>
    <button style="flex: none; min-height: 42px; padding: 0 14px; border: 1px solid #e6e3dc; border-radius: 12px; background: #fff; color: #6b675e; font-size: 14px; font-weight: 700;">모드 끄기</button>
  </div>

  <!-- 잔액 -->
  <div style="background: #fff; padding: 2px 18px 20px;">
    <div style="position: relative; overflow: hidden; background: #ffbc00; border-radius: 20px; padding: 18px 18px 16px; box-shadow: 0 1px 2px rgba(120, 85, 0, 0.10), 0 12px 30px rgba(255, 188, 0, 0.28);">
      <div style="position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px;">
        <div style="display: flex; flex-direction: column; gap: 3px;">
          <p style="margin: 0; font-size: 14px; font-weight: 700; color: #17161a;">KB국민ONE통장</p>
          <p class="num" style="margin: 0; font-size: 13px; font-weight: 600; color: #7a5c00;">123-45-****67</p>
        </div>
        <span style="flex: none; font-size: 12px; font-weight: 700; color: #7a5c00; background: rgba(255, 255, 255, 0.55); padding: 5px 10px; border-radius: 999px;">방금 확인</span>
      </div>
      <p style="position: relative; margin: 0 0 4px; font-size: 14px; font-weight: 600; color: #7a5c00;">지금 잔액</p>
      <div style="position: relative; display: flex; align-items: baseline; gap: 5px;">
        <span class="num" style="font-size: 38px; font-weight: 800; color: #17161a; letter-spacing: -1.6px; line-height: 1;">1,234,560</span>
        <span style="font-size: 20px; font-weight: 700; color: #17161a;">원</span>
      </div>
      <button style="position: relative; margin-top: 14px; min-height: 44px; padding: 0 16px 0 13px; display: inline-flex; align-items: center; gap: 8px; border: none; border-radius: 999px; background: #17161a; color: #fff; font-size: 15px; font-weight: 700;">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
        잔액 읽어주기
      </button>
    </div>
  </div>

  <!-- 할 수 있는 일 -->
  <div style="padding: 22px 18px 0;">
    <p style="margin: 0 0 12px; font-size: 14px; font-weight: 700; color: #9a968c; letter-spacing: 0.4px;">무엇을 도와드릴까요</p>

    <div style="display: flex; flex-direction: column; gap: 8px;">

      <button style="display: flex; align-items: center; gap: 14px; width: 100%; min-height: 78px; padding: 13px 14px; text-align: left; border: 1px solid #e9e6df; border-radius: 20px; background: #fff; box-shadow: 0 1px 2px rgba(23, 22, 26, 0.04), 0 8px 24px rgba(23, 22, 26, 0.05);">
        <span style="flex: none; width: 46px; height: 46px; border-radius: 14px; background: #ffbc00; display: flex; align-items: center; justify-content: center;">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#17161a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        </span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0;">
          <b style="font-size: 20px; font-weight: 800; color: #17161a; letter-spacing: -0.6px;">들어오고 나간 돈 듣기</b>
          <small style="font-size: 14px; font-weight: 500; color: #85817a;">새로 온 알림 3건</small>
        </span>
        <span class="num" style="flex: none; background: #17161a; color: #fff; font-size: 14px; font-weight: 800; min-width: 28px; height: 28px; padding: 0 9px; border-radius: 999px; display: flex; align-items: center; justify-content: center;">3</span>
      </button>

      <button style="display: flex; align-items: center; gap: 14px; width: 100%; min-height: 78px; padding: 13px 14px; text-align: left; border: 1px solid #e9e6df; border-radius: 20px; background: #fff; box-shadow: 0 1px 2px rgba(23, 22, 26, 0.04), 0 8px 24px rgba(23, 22, 26, 0.05);">
        <span style="flex: none; width: 46px; height: 46px; border-radius: 14px; background: #f3f2ee; display: flex; align-items: center; justify-content: center;">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#3d3a34" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v3"/></svg>
        </span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0;">
          <b style="font-size: 20px; font-weight: 800; color: #17161a; letter-spacing: -0.6px;">말로 물어보기</b>
          <small style="font-size: 14px; font-weight: 500; color: #85817a;">궁금한 걸 그냥 말씀하세요</small>
        </span>
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#c5c1b8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex: none;"><path d="m9 5 7 7-7 7"/></svg>
      </button>

      <button style="display: flex; align-items: center; gap: 14px; width: 100%; min-height: 78px; padding: 13px 14px; text-align: left; border: 1px solid #e9e6df; border-radius: 20px; background: #fff; box-shadow: 0 1px 2px rgba(23, 22, 26, 0.04), 0 8px 24px rgba(23, 22, 26, 0.05);">
        <span style="flex: none; width: 46px; height: 46px; border-radius: 14px; background: #f3f2ee; display: flex; align-items: center; justify-content: center;">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#3d3a34" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V10l7-5 7 5v11"/><path d="M10 21v-6h4v6"/></svg>
        </span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0;">
          <b style="font-size: 20px; font-weight: 800; color: #17161a; letter-spacing: -0.6px;">창구 갈 일 정리</b>
          <small style="font-size: 14px; font-weight: 500; color: #85817a;">은행에서 할 일을 적어드려요</small>
        </span>
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#c5c1b8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="flex: none;"><path d="m9 5 7 7-7 7"/></svg>
      </button>
    </div>
  </div>

  <!-- 내역: 카드 하나에 세 줄. 줄 사이는 머리카락 선. -->
  <div style="padding: 22px 18px 24px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between; margin: 0 0 12px;">
      <p style="margin: 0; font-size: 14px; font-weight: 700; color: #9a968c; letter-spacing: 0.4px;">들어오고 나간 돈</p>
      <p style="margin: 0; font-size: 13px; font-weight: 600; color: #b3afa6;">누르면 읽어드려요</p>
    </div>

    <div style="background: #fff; border: 1px solid #e9e6df; border-radius: 20px; padding: 0 18px; box-shadow: 0 1px 2px rgba(23, 22, 26, 0.04), 0 8px 24px rgba(23, 22, 26, 0.05); display: flex; flex-direction: column;">

      <button style="display: flex; align-items: center; gap: 14px; width: 100%; min-height: 76px; padding: 14px 0; border: none; border-bottom: 1px solid #f0eeea; background: transparent; text-align: left;">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 7px; min-width: 0;">
          <b style="font-size: 20px; font-weight: 800; color: #17161a; letter-spacing: -0.4px;">김철수</b>
          <span style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #85817a;">
            <span style="color: #1d7a3d; background: #e6f4ea; padding: 3px 9px; border-radius: 999px; font-weight: 700;">확인됨</span>
            어제 오후
          </span>
        </span>
        <b class="num" style="flex: none; font-size: 20px; font-weight: 800; color: #1558d6; letter-spacing: -0.4px;">+300,000원</b>
      </button>

      <button style="display: flex; align-items: center; gap: 14px; width: 100%; min-height: 76px; padding: 14px 0; border: none; border-bottom: 1px solid #f0eeea; background: transparent; text-align: left;">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 7px; min-width: 0;">
          <b style="font-size: 20px; font-weight: 800; color: #17161a; letter-spacing: -0.4px;">한국전력공사</b>
          <span style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #85817a;">
            <span style="color: #8a5a00; background: #fff4d1; padding: 3px 9px; border-radius: 999px; font-weight: 700;">일부 확인</span>
            오늘
          </span>
        </span>
        <b class="num" style="flex: none; font-size: 20px; font-weight: 800; color: #17161a; letter-spacing: -0.4px;">−42,000원</b>
      </button>

      <button style="display: flex; align-items: center; gap: 14px; width: 100%; min-height: 76px; padding: 14px 0; border: none; background: transparent; text-align: left;">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 7px; min-width: 0;">
          <b style="font-size: 20px; font-weight: 800; color: #17161a; letter-spacing: -0.4px;">국민라이프</b>
          <span style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #85817a;">
            <span style="color: #c5221f; background: #fdecec; padding: 3px 9px; border-radius: 999px; font-weight: 700;">확인 안 됨</span>
            오늘
          </span>
        </span>
        <b class="num" style="flex: none; font-size: 20px; font-weight: 800; color: #17161a; letter-spacing: -0.4px;">−19,000원</b>
      </button>

    </div>
  </div>
</div>
</x-dc>
</body>
</html>
