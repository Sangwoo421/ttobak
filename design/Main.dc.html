<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;600;700;800;900&display=swap');
    body { margin: 0; font-family: 'Gothic A1', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
    a { color: #8a6a00; } a:hover { color: #5e4800; }
  </style>
</helmet>

<!-- A안 다듬음 · 홈
     바뀐 것: 헤더와 잔액을 하나의 노란 면으로 잇고 카드가 그 위로 떠오르게,
     아이콘은 노란 원에 진한 글리프(면적을 키워 눈에 먼저 들어오게),
     주요 행동과 내역을 시각적으로 다른 종류로 분리, 그림자를 따뜻한 갈색 계열로 통일. -->
<div style="width: 460px; min-height: 900px; background: #f7f5f0; display: flex; flex-direction: column;">

  <!-- 노란 면: 헤더 + 잔액이 한 덩어리 -->
  <div style="background: linear-gradient(170deg, #ffc933 0%, #ffbc00 55%, #f5b000 100%); padding: 22px 20px 58px; position: relative; overflow: hidden;">

    <!-- KB 별 모티프: 아주 옅게 -->
    <svg viewBox="0 0 24 24" width="230" height="230" style="position: absolute; right: -58px; top: -46px; opacity: 0.10;" fill="#7a5c00"><path d="m12 2 2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.3 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8L12 2z"/></svg>

    <div style="position: relative; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;">
      <div style="display: flex; flex-direction: column; gap: 7px;">
        <span style="display: inline-flex; align-self: flex-start; align-items: center; gap: 6px; background: rgba(255,255,255,0.8); color: #6b4e00; font-size: 14px; font-weight: 800; padding: 5px 12px; border-radius: 999px; letter-spacing: 0.2px;">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="#6b4e00"><path d="m12 2 2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.3 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8L12 2z"/></svg>
          어르신 모드
        </span>
        <span style="font-size: 28px; font-weight: 900; color: #241a00; letter-spacing: -0.6px; line-height: 1.15;">김영자 님</span>
      </div>
      <button style="flex: none; min-height: 46px; padding: 0 15px; border: none; border-radius: 999px; background: rgba(255,255,255,0.9); color: #6b4e00; font-size: 15px; font-weight: 800; box-shadow: 0 2px 6px rgba(120,90,0,0.18);">모드 끄기</button>
    </div>
  </div>

  <!-- 잔액 카드: 노란 면 위로 떠오른다 -->
  <div style="margin: -44px 16px 0; background: #fff; border-radius: 22px; padding: 20px 22px 22px; box-shadow: 0 10px 26px rgba(120,90,20,0.14), 0 2px 6px rgba(120,90,20,0.08); position: relative;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="width: 8px; height: 8px; border-radius: 2px; background: #ffbc00;"></span>
      <span style="font-size: 16px; font-weight: 800; color: #6b6455;">KB국민ONE통장</span>
    </div>
    <div style="font-size: 14px; color: #a49b8b; margin: 3px 0 12px; letter-spacing: 0.4px;">123-45-****67</div>
    <div style="display: flex; align-items: baseline; gap: 4px;">
      <span style="font-size: 42px; font-weight: 900; color: #1b1b1b; letter-spacing: -1.8px; line-height: 1;">1,234,560</span>
      <span style="font-size: 25px; font-weight: 800; color: #4a4438;">원</span>
    </div>
    <div style="margin-top: 4px; font-size: 15px; font-weight: 700; color: #8a8172;">지금 통장에 있는 돈</div>
  </div>

  <!-- 주요 행동: 카드형, 아이콘은 노란 원 -->
  <div style="display: flex; flex-direction: column; gap: 11px; padding: 20px 16px 0;">

    <button style="display: flex; align-items: center; gap: 15px; width: 100%; min-height: 90px; padding: 15px 17px; text-align: left; border: none; border-radius: 20px; background: #fff; box-shadow: 0 3px 12px rgba(120,90,20,0.10); position: relative; overflow: hidden;">
      <span style="position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: #ffbc00;"></span>
      <span style="flex: none; width: 58px; height: 58px; border-radius: 50%; background: #ffbc00; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 8px rgba(200,150,0,0.32);">
        <svg viewBox="0 0 24 24" width="29" height="29" fill="none" stroke="#3d2e00" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      </span>
      <span style="display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0;">
        <b style="font-size: 23px; font-weight: 900; color: #1b1b1b; letter-spacing: -0.4px;">들어오고 나간 돈 듣기</b>
        <small style="font-size: 16px; font-weight: 600; color: #7d7566;">새로 온 것 3가지</small>
      </span>
      <span style="flex: none; background: #c5221f; color: #fff; font-size: 16px; font-weight: 900; min-width: 30px; height: 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center;">3</span>
    </button>

    <button style="display: flex; align-items: center; gap: 15px; width: 100%; min-height: 90px; padding: 15px 17px; text-align: left; border: none; border-radius: 20px; background: #fff; box-shadow: 0 3px 12px rgba(120,90,20,0.08);">
      <span style="flex: none; width: 58px; height: 58px; border-radius: 50%; background: #fff0c2; display: flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" width="29" height="29" fill="none" stroke="#6b4e00" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v3"/></svg>
      </span>
      <span style="display: flex; flex-direction: column; gap: 3px;">
        <b style="font-size: 23px; font-weight: 900; color: #1b1b1b; letter-spacing: -0.4px;">말로 물어보기</b>
        <small style="font-size: 16px; font-weight: 600; color: #7d7566;">궁금한 걸 그냥 말씀하세요</small>
      </span>
    </button>

    <button style="display: flex; align-items: center; gap: 15px; width: 100%; min-height: 90px; padding: 15px 17px; text-align: left; border: none; border-radius: 20px; background: #fff; box-shadow: 0 3px 12px rgba(120,90,20,0.08);">
      <span style="flex: none; width: 58px; height: 58px; border-radius: 50%; background: #fff0c2; display: flex; align-items: center; justify-content: center;">
        <svg viewBox="0 0 24 24" width="29" height="29" fill="none" stroke="#6b4e00" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V10l7-5 7 5v11"/><path d="M10 21v-6h4v6"/></svg>
      </span>
      <span style="display: flex; flex-direction: column; gap: 3px;">
        <b style="font-size: 23px; font-weight: 900; color: #1b1b1b; letter-spacing: -0.4px;">창구 갈 일 정리</b>
        <small style="font-size: 16px; font-weight: 600; color: #7d7566;">은행에서 할 일을 적어드려요</small>
      </span>
    </button>
  </div>

  <!-- 내역: 카드가 아니라 한 덩어리 목록으로. 위 행동과 종류가 다르다는 게 보이게. -->
  <div style="padding: 26px 16px 22px;">
    <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 3px;">
      <h3 style="margin: 0; font-size: 22px; font-weight: 900; color: #1b1b1b; letter-spacing: -0.4px;">들어오고 나간 돈</h3>
      <span style="font-size: 15px; font-weight: 700; color: #a49b8b;">최근 3건</span>
    </div>
    <p style="margin: 0 0 13px; font-size: 15px; font-weight: 600; color: #8a8172;">궁금한 줄을 누르면 읽어드려요</p>

    <div style="background: #fff; border-radius: 20px; overflow: hidden; box-shadow: 0 3px 12px rgba(120,90,20,0.08);">

      <button style="display: flex; align-items: center; gap: 13px; width: 100%; min-height: 88px; padding: 15px 17px; border: none; border-bottom: 1px solid #f0ece2; background: #fff; text-align: left;">
        <span style="flex: none; width: 44px; height: 44px; border-radius: 13px; background: #e8f0fe; display: flex; align-items: center; justify-content: center;">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#1558d6" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
        </span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 5px; min-width: 0;">
          <b style="font-size: 20px; font-weight: 900; color: #1b1b1b;">김철수</b>
          <span style="display: flex; align-items: center; gap: 7px; font-size: 14px; color: #8a8172;">
            어제
            <span style="background: #e6f4ea; color: #17703a; font-size: 13px; font-weight: 800; padding: 2px 8px; border-radius: 999px;">확인됨</span>
          </span>
        </span>
        <span style="flex: none; display: flex; align-items: center; gap: 11px;">
          <b style="font-size: 19px; font-weight: 900; color: #1558d6;">+300,000원</b>
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#b8ae9c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>
        </span>
      </button>

      <button style="display: flex; align-items: center; gap: 13px; width: 100%; min-height: 88px; padding: 15px 17px; border: none; border-bottom: 1px solid #f0ece2; background: #fff; text-align: left;">
        <span style="flex: none; width: 44px; height: 44px; border-radius: 13px; background: #f3f1ec; display: flex; align-items: center; justify-content: center;">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#5f5849" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>
        </span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 5px; min-width: 0;">
          <b style="font-size: 20px; font-weight: 900; color: #1b1b1b;">한국전력공사</b>
          <span style="display: flex; align-items: center; gap: 7px; font-size: 14px; color: #8a8172;">
            오늘
            <span style="background: #fef3d9; color: #8a4b00; font-size: 13px; font-weight: 800; padding: 2px 8px; border-radius: 999px;">일부 확인</span>
          </span>
        </span>
        <span style="flex: none; display: flex; align-items: center; gap: 11px;">
          <b style="font-size: 19px; font-weight: 900; color: #1b1b1b;">-42,000원</b>
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#b8ae9c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>
        </span>
      </button>

      <button style="display: flex; align-items: center; gap: 13px; width: 100%; min-height: 88px; padding: 15px 17px; border: none; background: #fffbfa; text-align: left;">
        <span style="flex: none; width: 44px; height: 44px; border-radius: 13px; background: #fce8e6; display: flex; align-items: center; justify-content: center;">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#c5221f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
        </span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 5px; min-width: 0;">
          <b style="font-size: 20px; font-weight: 900; color: #1b1b1b;">대한정보통신</b>
          <span style="display: flex; align-items: center; gap: 7px; font-size: 14px; color: #8a8172;">
            오늘
            <span style="background: #fce8e6; color: #a81b18; font-size: 13px; font-weight: 800; padding: 2px 8px; border-radius: 999px;">확인 안 됨</span>
          </span>
        </span>
        <span style="flex: none; display: flex; align-items: center; gap: 11px;">
          <b style="font-size: 19px; font-weight: 900; color: #1b1b1b;">-19,000원</b>
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#b8ae9c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>
        </span>
      </button>

    </div>
  </div>
</div>
</x-dc>
</body>
</html>
