<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;800;900&display=swap');
    body { margin: 0; font-family: 'Gothic A1', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
    a { color: #0b57d0; } a:hover { color: #06398a; }
  </style>
</helmet>

<!-- C안: 극단적 단순함 — 흑백 고대비, 아주 큰 글자, 화면당 선택지 최소.
     눈이 나쁘거나 손이 떨려도 누를 수 있는 것을 최우선으로 둔다. -->
<div style="width: 460px; min-height: 900px; background: #fff; display: flex; flex-direction: column;">

  <!-- 헤더 -->
  <div style="padding: 20px 20px 18px; border-bottom: 4px solid #111;">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
      <p style="margin: 0; font-size: 20px; font-weight: 900; color: #111;">김영자 님</p>
      <button style="min-height: 46px; padding: 0 14px; border: 3px solid #111; border-radius: 8px; background: #fff; color: #111; font-size: 16px; font-weight: 900;">모드 끄기</button>
    </div>
  </div>

  <!-- 잔액 -->
  <div style="padding: 26px 20px; border-bottom: 4px solid #111; background: #111;">
    <p style="margin: 0 0 6px; font-size: 20px; font-weight: 700; color: #d6d6d6;">지금 남은 돈</p>
    <p style="margin: 0; font-size: 46px; font-weight: 900; color: #fff; letter-spacing: -1.5px; line-height: 1.05;">1,234,560원</p>
  </div>

  <!-- 큰 버튼 두 개만 -->
  <div style="padding: 20px; display: flex; flex-direction: column; gap: 16px;">

    <button style="width: 100%; min-height: 130px; border: 4px solid #111; border-radius: 12px; background: #ffd400; display: flex; align-items: center; gap: 18px; padding: 0 22px; text-align: left;">
      <svg viewBox="0 0 24 24" width="46" height="46" fill="none" stroke="#111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
      <span style="display: flex; flex-direction: column; gap: 4px;">
        <b style="font-size: 30px; font-weight: 900; color: #111; letter-spacing: -0.5px;">돈 듣기</b>
        <small style="font-size: 18px; font-weight: 700; color: #4a4a4a;">새로 온 것 3가지</small>
      </span>
    </button>

    <button style="width: 100%; min-height: 130px; border: 4px solid #111; border-radius: 12px; background: #fff; display: flex; align-items: center; gap: 18px; padding: 0 22px; text-align: left;">
      <svg viewBox="0 0 24 24" width="46" height="46" fill="none" stroke="#111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v3"/></svg>
      <span style="display: flex; flex-direction: column; gap: 4px;">
        <b style="font-size: 30px; font-weight: 900; color: #111; letter-spacing: -0.5px;">말하기</b>
        <small style="font-size: 18px; font-weight: 700; color: #4a4a4a;">궁금한 걸 그냥 말씀하세요</small>
      </span>
    </button>

    <button style="width: 100%; min-height: 96px; border: 4px solid #111; border-radius: 12px; background: #fff; display: flex; align-items: center; gap: 18px; padding: 0 22px; text-align: left;">
      <svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="#111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V9l7-5 7 5v12"/><path d="M9 21v-6h6v6"/></svg>
      <b style="font-size: 25px; font-weight: 900; color: #111;">창구 갈 일 정리</b>
    </button>
  </div>

  <!-- 내역: 아주 단순한 줄 -->
  <div style="padding: 8px 20px 24px;">
    <p style="margin: 0 0 14px; font-size: 25px; font-weight: 900; color: #111;">들어오고 나간 돈</p>

    <div style="display: flex; flex-direction: column; gap: 12px;">

      <button style="width: 100%; min-height: 92px; border: 3px solid #111; border-radius: 12px; background: #fff; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left;">
        <span style="display: flex; flex-direction: column; gap: 4px;">
          <b style="font-size: 24px; font-weight: 900; color: #111;">김철수</b>
          <span style="font-size: 17px; font-weight: 700; color: #4a4a4a;">어제</span>
        </span>
        <b style="font-size: 24px; font-weight: 900; color: #0b57d0;">+300,000</b>
      </button>

      <button style="width: 100%; min-height: 92px; border: 3px solid #111; border-radius: 12px; background: #fff; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left;">
        <span style="display: flex; flex-direction: column; gap: 4px;">
          <b style="font-size: 24px; font-weight: 900; color: #111;">한국전력공사</b>
          <span style="font-size: 17px; font-weight: 700; color: #4a4a4a;">오늘</span>
        </span>
        <b style="font-size: 24px; font-weight: 900; color: #111;">-42,000</b>
      </button>

      <button style="width: 100%; min-height: 92px; border: 4px solid #c5221f; border-radius: 12px; background: #fff; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left;">
        <span style="display: flex; flex-direction: column; gap: 4px;">
          <b style="font-size: 24px; font-weight: 900; color: #111;">대한정보통신</b>
          <span style="font-size: 17px; font-weight: 900; color: #c5221f;">오늘 · 모르는 돈</span>
        </span>
        <b style="font-size: 24px; font-weight: 900; color: #111;">-19,000</b>
      </button>

    </div>
  </div>
</div>
</x-dc>
</body>
</html>
