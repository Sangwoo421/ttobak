<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;600;700;800&display=swap');
    body { margin: 0; font-family: 'Gothic A1', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #8a6a00; } a:hover { color: #5e4800; }
    button, input { font-family: inherit; }
    button { cursor: pointer; }
    .num { font-variant-numeric: tabular-nums; }
    .bar { width: 4px; border-radius: 2px; background: #1d7a3d; animation: bar 1.1s ease-in-out infinite; }
    .bar:nth-child(2) { animation-delay: 0.18s; }
    .bar:nth-child(3) { animation-delay: 0.36s; }
    .bar:nth-child(4) { animation-delay: 0.54s; }
    @keyframes bar { 0%, 100% { height: 6px; } 50% { height: 18px; } }
  </style>
</helmet>

<!-- A안 · 대화 — 마감본
     · 말풍선은 말한 쪽 모서리 하나만 각지게. 꼬리 없이 방향이 읽힌다.
     · 앱 말풍선 위에 작은 이름표. 누가 말하는지 첫 줄에서 알 수 있다.
     · 어떤 알림을 듣고 있는지 위에 작은 칩으로. 맥락이 사라지지 않는다.
     · 듣는 중 표시는 움직이는 막대 넷. 화면에서 유일하게 움직이는 것. -->
<div style="width: 393px; min-height: 852px; background: #f3f2ee; display: flex; flex-direction: column;">

  <!-- 헤더 -->
  <div style="background: #fff; padding: 14px 18px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid #edebe5;">
    <button style="flex: none; width: 48px; height: 48px; border-radius: 14px; border: 1px solid #e6e3dc; background: #fff; display: flex; align-items: center; justify-content: center;">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#3d3a34" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg>
    </button>
    <h1 style="flex: 1; margin: 0; font-size: 23px; font-weight: 800; color: #17161a; letter-spacing: -0.5px;">물어보기</h1>
    <span style="flex: none; display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 700; color: #8a5a00; background: #fff4d1; padding: 8px 13px 8px 11px; border-radius: 999px;">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#8a5a00" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>
      창구 목록 1
    </span>
  </div>

  <!-- 대화 -->
  <div style="flex: 1; padding: 18px 18px 14px; display: flex; flex-direction: column; gap: 14px;">

    <span class="num" style="align-self: center; font-size: 13px; font-weight: 700; color: #85817a; background: #e9e7e0; padding: 6px 12px; border-radius: 999px;">어제 · 김철수 +300,000원 알림</span>

    <div style="display: flex; flex-direction: column; gap: 6px; max-width: 88%;">
      <span style="margin-left: 6px; font-size: 13px; font-weight: 700; color: #9a968c;">또박또박</span>
      <div style="background: #fff; border: 1px solid #e9e6df; border-radius: 22px 22px 22px 8px; padding: 18px 20px; box-shadow: 0 1px 2px rgba(23, 22, 26, 0.04), 0 6px 18px rgba(23, 22, 26, 0.04);">
        <p style="margin: 0; font-size: 22px; line-height: 1.6; color: #17161a; letter-spacing: -0.3px;">어제 오후에 아드님 김철수 님이 <b class="num" style="font-weight: 800;">300,000원</b> 보내셨어요. 등록된 아들 통장이에요.</p>
      </div>
    </div>

    <div style="align-self: flex-end; max-width: 82%; background: #ffbc00; border-radius: 22px 22px 8px 22px; padding: 15px 20px; box-shadow: 0 1px 2px rgba(120, 85, 0, 0.10), 0 6px 18px rgba(255, 188, 0, 0.22);">
      <p style="margin: 0; font-size: 21px; line-height: 1.55; color: #17161a; letter-spacing: -0.3px;">세 번째 그 정보통신인가 그건 뭐야</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px; max-width: 92%;">
      <span style="margin-left: 6px; font-size: 13px; font-weight: 700; color: #9a968c;">또박또박</span>
      <div style="background: #fff; border: 1px solid #e9e6df; border-radius: 22px 22px 22px 8px; padding: 18px 20px; box-shadow: 0 1px 2px rgba(23, 22, 26, 0.04), 0 6px 18px rgba(23, 22, 26, 0.04);">
        <p style="margin: 0; font-size: 22px; line-height: 1.6; color: #17161a; letter-spacing: -0.3px;">통장에는 ‘국민라이프’라고만 적혀 있어서, 무슨 돈인지는 제가 알 수 없어요.</p>
        <div style="height: 1px; background: #f0eeea; margin: 14px 0;"></div>
        <p style="margin: 0; font-size: 22px; line-height: 1.6; font-weight: 800; color: #17161a; letter-spacing: -0.3px;">창구에서 여쭤볼 목록에 적어둘까요?</p>
      </div>
    </div>

  </div>

  <!-- 하단 -->
  <div style="background: #fff; padding: 18px 18px 24px; display: flex; flex-direction: column; gap: 12px; border-top: 1px solid #edebe5;">

    <div style="display: flex; align-items: center; gap: 10px; align-self: center; min-height: 22px;">
      <span style="display: flex; align-items: center; gap: 3px; height: 18px;">
        <span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
      </span>
      <span style="font-size: 16px; font-weight: 700; color: #1d7a3d;">듣고 있어요, 말씀하세요</span>
    </div>

    <button style="width: 100%; min-height: 88px; display: flex; align-items: center; justify-content: center; gap: 13px; border-radius: 22px; border: none; background: #17161a; color: #fff; font-size: 24px; font-weight: 800; letter-spacing: -0.5px; box-shadow: 0 10px 26px rgba(23, 22, 26, 0.22);">
      <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v3"/></svg>
      눌러서 말하기
    </button>

    <div style="display: flex; gap: 10px;">
      <button style="flex: 1; min-height: 76px; border-radius: 18px; border: none; background: #ffbc00; color: #17161a; font-size: 21px; font-weight: 800; letter-spacing: -0.4px;">네, 적어주세요</button>
      <button style="flex: 1; min-height: 76px; border-radius: 18px; border: 1px solid #e6e3dc; background: #fff; color: #4a463f; font-size: 21px; font-weight: 800; letter-spacing: -0.4px;">아니요</button>
    </div>

    <div style="display: flex; gap: 8px; padding-top: 2px;">
      <input placeholder="글로 물어보세요" style="flex: 1; min-height: 54px; border: 1px solid #e6e3dc; border-radius: 15px; padding: 0 16px; font-size: 17px; color: #17161a; background: #f8f7f4;">
      <button style="flex: none; min-height: 54px; padding: 0 20px; border-radius: 15px; border: 1px solid #e6e3dc; background: #fff; color: #6b675e; font-size: 17px; font-weight: 700;">보내기</button>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
