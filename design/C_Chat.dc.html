<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gothic+A1:wght@700;800;900&display=swap');
    body { margin: 0; font-family: 'Gothic A1', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
    a { color: #0b57d0; } a:hover { color: #06398a; }
  </style>
</helmet>

<!-- C안 대화: 마지막 한 마디만 크게. 지난 대화는 접어두고, 지금 답할 것만 보여준다. -->
<div style="width: 460px; min-height: 900px; background: #fff; display: flex; flex-direction: column;">

  <div style="padding: 14px 18px; border-bottom: 4px solid #111; display: flex; align-items: center; gap: 12px;">
    <button style="flex: none; width: 54px; height: 54px; border: 3px solid #111; border-radius: 10px; background: #fff; display: flex; align-items: center; justify-content: center;">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"/></svg>
    </button>
    <h1 style="flex: 1; margin: 0; font-size: 26px; font-weight: 900; color: #111;">물어보기</h1>
  </div>

  <!-- 지난 대화: 작게 접어둠 -->
  <div style="padding: 14px 18px 0;">
    <p style="margin: 0 0 6px; font-size: 15px; font-weight: 800; color: #767676;">방금 하신 말</p>
    <p style="margin: 0; font-size: 18px; font-weight: 700; color: #4a4a4a; padding: 10px 14px; background: #f2f2f2; border-radius: 10px;">세 번째 그 정보통신인가 그건 뭐야</p>
  </div>

  <!-- 지금 답: 아주 크게 -->
  <div style="flex: 1; padding: 22px 18px; display: flex; flex-direction: column; justify-content: center;">
    <div style="border: 4px solid #111; border-radius: 14px; padding: 24px 20px; background: #fff;">
      <p style="margin: 0; font-size: 29px; font-weight: 800; line-height: 1.5; color: #111; letter-spacing: -0.5px;">통장에 '대한정보통신'이라고만 적혀 있어요.</p>
      <p style="margin: 16px 0 0; font-size: 29px; font-weight: 800; line-height: 1.5; color: #111; letter-spacing: -0.5px;">무슨 돈인지 제가 알 수 없어요.</p>
      <div style="height: 3px; background: #111; margin: 20px 0;"></div>
      <p style="margin: 0; font-size: 27px; font-weight: 900; line-height: 1.45; color: #111;">창구에서 여쭤볼까요?</p>
    </div>
  </div>

  <!-- 답하기: 두 개만 -->
  <div style="padding: 0 18px 18px; display: flex; gap: 14px;">
    <button style="flex: 1; min-height: 110px; border: 4px solid #111; border-radius: 12px; background: #ffd400; color: #111; font-size: 28px; font-weight: 900;">네</button>
    <button style="flex: 1; min-height: 110px; border: 4px solid #111; border-radius: 12px; background: #fff; color: #111; font-size: 28px; font-weight: 900;">아니요</button>
  </div>

  <!-- 마이크 -->
  <div style="padding: 0 18px 24px;">
    <button style="width: 100%; min-height: 96px; border: 4px solid #111; border-radius: 12px; background: #111; color: #fff; display: flex; align-items: center; justify-content: center; gap: 14px; font-size: 27px; font-weight: 900;">
      <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v3"/></svg>
      말하기
    </button>
    <p style="margin: 12px 0 0; text-align: center; font-size: 18px; font-weight: 700; color: #4a4a4a;">눌러서 말씀하셔도 돼요</p>
  </div>
</div>
</x-dc>
</body>
</html>
