openapi: 3.0.3
info:
  title: 또박또박 Backend API
  version: 0.1.0
  description: |
    데이터·판정(규칙 엔진)·창구 요약서 저장을 담당한다. Spring Boot 3 + MyBatis + MySQL.
    - JSON 필드는 모두 snake_case (Jackson SNAKE_CASE 전역 설정).
    - 시각은 ISO-8601 (예: 2026-09-08T15:12:00).
    - 이 파일이 프론트·AI 서버와의 유일한 계약이다. 변경은 고현준 확인 후 팀 공지.
servers:
  - url: http://localhost:8080

tags:
  - { name: briefing, description: 알림 브리핑 선별 (담당 안상우) }
  - { name: classification, description: 거래 확인 가능 여부 규칙 엔진 (담당 안상우) }
  - { name: counterparties, description: 등록 수취인·거래 상대 (담당 안상우) }
  - { name: summaries, description: 창구 요약서 (담당 강두형) }
  - { name: auth, description: 해커톤용 간편 로그인 세션 }
  - { name: branch-tickets, description: 은행 지점 조회와 모바일 대기표 }
  - { name: staff, description: 직원용 조회·처리 (담당 강두형) }
  - { name: logs, description: 대화 로그 P1 (담당 안상우) }

paths:
  /api/health:
    get:
      summary: 헬스체크
      responses:
        "200": { description: ok, content: { application/json: { schema: { type: object, properties: { status: { type: string, example: ok } } } } } }

  /api/auth/simple-login:
    post:
      tags: [auth]
      summary: 해커톤용 6자리 간편비밀번호 로그인
      description: 실제 서비스에서는 은행 인증 서버와 FIDO/생체인증으로 교체한다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SimpleLoginRequest" }
      responses:
        "200": { description: 로그인됨, content: { application/json: { schema: { $ref: "#/components/schemas/AuthSession" } } } }
        "401": { description: 비밀번호 불일치 }

  /api/auth/session:
    get:
      tags: [auth]
      summary: 현재 간편 로그인 세션 확인
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: 로그인 사용자, content: { application/json: { schema: { $ref: "#/components/schemas/AuthUser" } } } }
        "401": { description: 로그인 필요 또는 만료 }

  /api/auth/logout:
    post:
      tags: [auth]
      summary: 현재 간편 로그인 세션 종료
      security: [{ bearerAuth: [] }]
      responses:
        "204": { description: 로그아웃됨 }

  /api/branches:
    get:
      tags: [branch-tickets]
      summary: 대기표 발급이 가능한 지점과 예상 대기 현황
      responses:
        "200":
          description: 지점 목록
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/BankBranch" } }

  /api/branches/{branch_id}/tickets:
    post:
      tags: [branch-tickets]
      summary: 선택한 지점의 모바일 대기표 발급
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: branch_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BranchTicketCreateRequest" }
      responses:
        "201": { description: 발급됨, content: { application/json: { schema: { $ref: "#/components/schemas/BranchTicket" } } } }
        "401": { description: 로그인 필요 }
        "409": { description: 다른 활성 대기표가 이미 있음 }

  /api/branch-tickets/active:
    get:
      tags: [branch-tickets]
      summary: 로그인 사용자의 활성 대기표 조회
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: user_id, in: query, required: true, schema: { type: integer } }
      responses:
        "200":
          description: 활성 대기표. 없으면 빈 응답 본문.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BranchTicket", nullable: true }

  /api/branch-tickets/{ticket_id}:
    get:
      tags: [branch-tickets]
      summary: 내 대기표 현재 상태 조회
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: ticket_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: 대기표, content: { application/json: { schema: { $ref: "#/components/schemas/BranchTicket" } } } }
        "404": { description: 대기표 없음 }
    delete:
      tags: [branch-tickets]
      summary: 대기 중인 내 대기표 취소
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: ticket_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: 취소됨, content: { application/json: { schema: { $ref: "#/components/schemas/BranchTicket" } } } }
        "409": { description: 이미 호출 또는 완료되어 취소 불가 }

  /api/users/{user_id}/briefing:
    get:
      tags: [briefing]
      summary: 미청취 입출금 알림을 최근순 최대 3건 선별해 거래·분류 결과와 함께 반환
      description: |
        선별 규칙: heard_at IS NULL AND mute_rules 에 없는 상대 → occurred_at DESC → LIMIT 3.
        무엇을 읽을지는 시스템이 판정하지 않는다(뮤트는 사용자가 직접 등록한 것만).
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: integer }, example: 1 }
      responses:
        "200":
          description: 브리핑 항목
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BriefingResponse" }
              example: { $ref: "./examples/briefing.json" }

  /api/notifications/{notification_id}/heard:
    post:
      tags: [briefing]
      summary: 음성으로 들었음을 기록 (heard_at = now). 이미 들은 항목은 다시 읽지 않는다.
      parameters:
        - { name: notification_id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: 기록됨 }

  /api/users/{user_id}/transactions:
    get:
      tags: [briefing]
      summary: 최근 거래 목록 (어르신 모드 홈·내역 화면용)
      description: |
        브리핑과 다르다. 브리핑은 미청취 알림만 최대 3건 주므로 한 번 들으면 비어 버린다.
        내역 화면은 들었든 안 들었든 최근 거래를 그대로 보여줘야 해서 별도 경로가 필요하다.
        응답은 BriefingItem 과 같은 모양이고 notification_id 만 null 이다(알림이 아니라 거래에서 출발).
        조회 전용이다.
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: integer }, example: 1 }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 10, maximum: 50 } }
      responses:
        "200":
          description: 최근순 거래와 분류 결과
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/BriefingItem" } }

  /api/users/{user_id}/counterparties:
    get:
      tags: [counterparties]
      summary: 등록 수취인·거래 상대 목록 (STT 어휘 힌트, 후보 대조, 요약서 생성에 사용)
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: 목록
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Counterparty" } }

  /api/transactions/{transaction_id}/classification:
    get:
      tags: [classification]
      summary: 거래 1건의 확인 가능 여부를 규칙 엔진으로 판정
      description: |
        규칙은 docs/contracts/classification-rules.md. 같은 입력 → 같은 결과(결정적).
        LLM은 이 결과의 facts 만 가지고 설명 문장을 만든다.
      parameters:
        - { name: transaction_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: 판정
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Classification" }
        "404": { description: 없는 거래 }

  /api/mute-rules:
    post:
      tags: [briefing]
      summary: 사용자가 "매번 안 들어도 돼요"로 끈 상대 등록
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, counterparty_name]
              properties:
                user_id: { type: integer }
                counterparty_name: { type: string, example: 한국전력공사 }
      responses:
        "201": { description: 등록됨 }

  /api/summaries:
    post:
      tags: [summaries]
      summary: 창구 요약서 생성. 코드·번호표·준비물은 서버가 계산한다.
      description: |
        준비물 규칙: REQUEST 에 TRANSFER 가 있으면 신분증 필수, 통장/카드 권장.
        번호표는 목업(브랜치별 카운터). 코드는 6자리 숫자 유니크.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SummaryCreateRequest" }
            example: { $ref: "./examples/summary-create-request.json" }
      responses:
        "201":
          description: 생성된 요약서
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Summary" }
              example: { $ref: "./examples/summary.json" }

  /api/summaries/{summary_id}:
    get:
      tags: [summaries]
      summary: 요약서 상세
      parameters:
        - { name: summary_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: 요약서, content: { application/json: { schema: { $ref: "#/components/schemas/Summary" } } } }
        "404": { description: 없음 }

  /api/summaries/by-code/{code}:
    get:
      tags: [summaries]
      summary: 6자리 코드로 요약서 조회 (직원 화면 진입)
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, pattern: "^[0-9]{6}$" } }
      responses:
        "200": { description: 요약서, content: { application/json: { schema: { $ref: "#/components/schemas/Summary" } } } }
        "404": { description: 없음 }

  /api/summaries/{summary_id}/status:
    get:
      tags: [summaries]
      summary: 처리 상태 (어르신 앱이 폴링해서 "처리됐어요" 음성 안내)
      parameters:
        - { name: summary_id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: 상태
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SummaryStatus" }

  /api/staff/summaries:
    get:
      tags: [staff]
      summary: 직원용 요약서 목록 (최근순)
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [OPEN, IN_PROGRESS, DONE] } }
      responses:
        "200":
          description: 목록
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/StaffSummaryListItem" } }

  /api/staff/summaries/{summary_id}/items/{item_id}:
    patch:
      tags: [staff]
      summary: 항목 처리 체크. 모든 REQUEST/QUESTION 이 처리되면 요약서 status = DONE.
      parameters:
        - { name: summary_id, in: path, required: true, schema: { type: integer } }
        - { name: item_id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [handled]
              properties:
                handled: { type: boolean }
      responses:
        "200": { description: 갱신된 요약서, content: { application/json: { schema: { $ref: "#/components/schemas/Summary" } } } }

  /api/dialog-logs:
    post:
      tags: [logs]
      summary: AI 서버가 턴마다 판정 근거를 남긴다 (P1, 사후 검증용)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DialogLog" }
      responses:
        "201": { description: 저장됨 }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque

  schemas:
    SimpleLoginRequest:
      type: object
      required: [user_id, pin]
      properties:
        user_id: { type: integer, example: 1 }
        pin: { type: string, pattern: "^[0-9]{6}$", example: "123456" }

    AuthSession:
      type: object
      required: [access_token, token_type, expires_in_seconds, user_id, user_name]
      properties:
        access_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in_seconds: { type: integer, example: 1800 }
        user_id: { type: integer, example: 1 }
        user_name: { type: string, example: 김영자 }

    AuthUser:
      type: object
      required: [user_id, user_name]
      properties:
        user_id: { type: integer, example: 1 }
        user_name: { type: string, example: 김영자 }

    BankBranch:
      type: object
      required: [id, name, district, address, opening_hours, waiting_count, estimated_wait_minutes]
      properties:
        id: { type: integer }
        name: { type: string, example: KB국민은행 종로지점 }
        district: { type: string, example: 종로구 }
        address: { type: string, example: 서울 종로구 종로 }
        opening_hours: { type: string, example: "평일 09:00~16:00" }
        waiting_count: { type: integer, example: 3 }
        estimated_wait_minutes: { type: integer, example: 18 }

    BranchTicketCreateRequest:
      type: object
      required: [user_id]
      properties:
        user_id: { type: integer, example: 1 }
        summary_id: { type: integer, nullable: true, description: 창구 할 일 요약서와 함께 발급할 때 전달 }
        purpose: { type: string, maxLength: 60, example: 일반 상담 }

    BranchTicket:
      type: object
      required: [id, branch_id, branch_name, branch_address, ticket_no, purpose, status, ahead_count, estimated_wait_minutes, issued_at]
      properties:
        id: { type: integer }
        branch_id: { type: integer }
        summary_id: { type: integer, nullable: true }
        summary_code: { type: string, nullable: true, pattern: "^[0-9]{6}$" }
        branch_name: { type: string }
        branch_address: { type: string }
        ticket_no: { type: integer, example: 15 }
        purpose: { type: string, example: 일반 상담 }
        status: { type: string, enum: [WAITING, CALLED, DONE, CANCELLED] }
        ahead_count: { type: integer, example: 3 }
        estimated_wait_minutes: { type: integer, example: 18 }
        issued_at: { type: string, format: date-time }

    Transaction:
      type: object
      required: [id, account_id, type, amount, counterparty_name, occurred_at]
      properties:
        id: { type: integer, example: 101 }
        account_id: { type: integer, example: 1 }
        type: { type: string, enum: [IN, OUT] }
        amount: { type: integer, example: 300000 }
        counterparty_name: { type: string, example: 김철수 }
        memo: { type: string, nullable: true, example: 김철수 }
        channel: { type: string, nullable: true, example: 이체 }
        occurred_at: { type: string, format: date-time }
        counterparty_id: { type: integer, nullable: true, example: 1 }

    Classification:
      type: object
      required: [transaction_id, level, spoken_name, facts, unknowns]
      properties:
        transaction_id: { type: integer }
        level:
          type: string
          enum: [CONFIRMED, PARTIAL, UNKNOWN]
          description: CONFIRMED 확인 가능 / PARTIAL 부분 확인 / UNKNOWN 확인 불가
        rule_id:
          type: string
          description: 적용된 규칙 식별자 (classification-rules.md 의 R1~R5). 재현성 증명용.
          example: R1_REGISTERED_PERSON
        spoken_name:
          type: string
          description: 음성 브리핑용 생활어 상대명. 예 "아드님 김철수 님", "한국전력", "'대한정보통신'이라는 곳"
        facts:
          type: array
          description: 앱이 확실히 아는 사실. LLM 은 이 밖의 정보를 말하면 안 된다.
          items: { type: string }
        unknowns:
          type: array
          description: 앱이 알 수 없는 것. UNKNOWN/PARTIAL 에서 채워진다.
          items: { type: string }
        counter_hint:
          type: string
          nullable: true
          description: 창구에서 여쭤볼 목록에 담을 때의 질문 문장 초안
        counterparty: { $ref: "#/components/schemas/Counterparty", nullable: true }

    BriefingItem:
      type: object
      required: [ordinal, notification_id, transaction, classification]
      properties:
        ordinal: { type: integer, description: 읽는 순서 1..3 }
        notification_id: { type: integer }
        transaction: { $ref: "#/components/schemas/Transaction" }
        classification: { $ref: "#/components/schemas/Classification" }

    BriefingResponse:
      type: object
      required: [user_id, user_name, items, remaining_count]
      properties:
        user_id: { type: integer }
        user_name: { type: string, example: 김영자 }
        items: { type: array, maxItems: 3, items: { $ref: "#/components/schemas/BriefingItem" } }
        remaining_count: { type: integer, description: 이번에 읽지 않은 미청취 건수 }

    Counterparty:
      type: object
      required: [id, name, kind]
      properties:
        id: { type: integer }
        name: { type: string, example: 김철수 }
        relation: { type: string, nullable: true, example: 아들 }
        kind: { type: string, enum: [PERSON, INSTITUTION] }
        bank_name: { type: string, nullable: true }
        account_number_masked: { type: string, nullable: true, example: 9876-54-****98 }
        aliases: { type: array, items: { type: string }, example: [아들, 철수, 큰아들] }
        category: { type: string, nullable: true, example: 전기요금 }

    SummaryCreateRequest:
      type: object
      required: [user_id]
      properties:
        user_id: { type: integer }
        session_id: { type: string, nullable: true }
        branch_name: { type: string, nullable: true, description: 없으면 users.home_branch }
        requests:
          type: array
          items: { $ref: "#/components/schemas/RequestItemPayload" }
        questions:
          type: array
          items: { $ref: "#/components/schemas/QuestionItemPayload" }

    RequestItemPayload:
      type: object
      required: [type, recipient_name, amount]
      properties:
        type: { type: string, enum: [TRANSFER] }
        recipient_counterparty_id: { type: integer, nullable: true }
        recipient_name: { type: string, example: 김철수 }
        recipient_relation: { type: string, nullable: true, example: 아들 }
        recipient_bank: { type: string, nullable: true }
        recipient_account_masked: { type: string, nullable: true, description: 서버가 counterparty 로 채운다 }
        amount: { type: integer, example: 200000 }
        note: { type: string, nullable: true }
        confirmed_by_user: { type: boolean, description: CONFIRM 단계에서 예 응답을 받았는지. false 면 400. }

    QuestionItemPayload:
      type: object
      required: [text]
      properties:
        transaction_id: { type: integer, nullable: true }
        text: { type: string, example: "'대한정보통신' 19,000원 출금이 무엇인지" }

    PrepItemPayload:
      type: object
      properties:
        item: { type: string, example: 신분증 }
        required: { type: boolean }

    SummaryItem:
      type: object
      required: [id, section, ordinal, payload, handled]
      properties:
        id: { type: integer }
        section: { type: string, enum: [REQUEST, QUESTION, PREP] }
        ordinal: { type: integer }
        payload:
          description: section 별로 RequestItemPayload / QuestionItemPayload / PrepItemPayload
          type: object
        handled: { type: boolean }
        handled_at: { type: string, format: date-time, nullable: true }

    Summary:
      type: object
      required: [id, code, ticket_no, branch_name, status, user_name, created_at, items]
      properties:
        id: { type: integer }
        code: { type: string, example: "482913" }
        ticket_no: { type: integer, example: 12 }
        branch_name: { type: string, example: KB국민은행 종로지점 }
        status: { type: string, enum: [OPEN, IN_PROGRESS, DONE] }
        user_name: { type: string }
        user_id: { type: integer }
        created_at: { type: string, format: date-time }
        items: { type: array, items: { $ref: "#/components/schemas/SummaryItem" } }

    SummaryStatus:
      type: object
      required: [id, status, handled_count, total_count]
      properties:
        id: { type: integer }
        status: { type: string, enum: [OPEN, IN_PROGRESS, DONE] }
        handled_count: { type: integer }
        total_count: { type: integer, description: PREP 제외 }
        last_handled_at: { type: string, format: date-time, nullable: true }

    StaffSummaryListItem:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        ticket_no: { type: integer }
        user_name: { type: string }
        status: { type: string }
        created_at: { type: string, format: date-time }
        item_count: { type: integer }

    DialogLog:
      type: object
      required: [session_id, user_id, turn_no]
      properties:
        session_id: { type: string }
        user_id: { type: integer }
        turn_no: { type: integer }
        user_text: { type: string, nullable: true }
        intent: { type: string, nullable: true }
        confidence: { type: number, nullable: true }
        matched: { type: string, nullable: true }
        decision: { type: string, enum: [ACCEPT, ASK_AGAIN, BUTTON, LLM_TIEBREAK], nullable: true }
        state: { type: string, nullable: true }
